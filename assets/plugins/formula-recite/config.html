<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>公式默写 配置</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 16px; }
    .form { display: flex; flex-direction: column; gap: 14px; max-width: 520px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; }
    .field .desc { font-size: 12px; color: var(--muted); }
    select, input[type="number"] {
      font-size: 14px; padding: 9px 10px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
    }
    .switch { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .switch input { width: 18px; height: 18px; }
    .row { display: flex; gap: 10px; margin-top: 6px; }
    .row .primary { flex: 1; }
    .footer { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="form">
    <div class="field">
      <label for="timerMode">计时模式</label>
      <select id="timerMode">
        <option value="off">关闭</option>
        <option value="countdown">每题倒计时</option>
        <option value="stopwatch">正计时（只记录用时）</option>
      </select>
      <span class="desc">倒计时结束时按下方「超时行为」处理。</span>
    </div>

    <div class="field">
      <label for="timeLimit">倒计时时长</label>
      <select id="timeLimit">
        <option value="30">30 秒</option>
        <option value="45">45 秒</option>
        <option value="60">60 秒</option>
        <option value="90">90 秒</option>
        <option value="120">120 秒</option>
      </select>
    </div>

    <div class="field">
      <label for="timeoutAction">超时行为</label>
      <select id="timeoutAction">
        <option value="autoSubmit">自动提交已写内容判分</option>
        <option value="markWrong">直接判为作答错</option>
        <option value="notify">只提醒，继续作答</option>
      </select>
    </div>

    <div class="field">
      <label for="penWidth">默认笔粗（1–8）</label>
      <input id="penWidth" type="number" min="1" max="8" step="1" value="3">
    </div>

    <div class="field">
      <label>画布</label>
      <label class="switch"><input id="showGrid" type="checkbox"> 显示方格纸背景</label>
      <label class="switch"><input id="autoCrop" type="checkbox"> 提交时自动裁掉白边</label>
    </div>

    <div class="field">
      <label>AI</label>
      <label class="switch"><input id="aiExplainAuto" type="checkbox"> 判分后自动请求 AI 解析（会多花一次额度）</label>
    </div>

    <div class="row">
      <button id="save" class="primary" type="button">保存</button>
      <button id="reset" class="ghost" type="button">恢复默认</button>
    </div>
    <div class="footer" id="plugin-version"></div>
  </div>
  <script src="bridge.js"></script>
  <script src="config.js"></script>
</body>
</html>
