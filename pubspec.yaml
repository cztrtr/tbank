name: tbank
description: "本地题库刷题 App：扫描 JSON 题库、逐题作答、记录并回写每题统计。"
publish_to: 'none'
version: 0.4.2+46

environment:
  sdk: ^3.13.5

dependencies:
  # 插件 zip 包解压
  archive: ^4.0.0
  # 调起系统目录选择器（仅桌面端使用；Android 走 SAF 原生通道）
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  # DeepSeek API 请求（REST 调用，见 lib/services/ds_api_service.dart）
  flutter_math_fork: ^0.7.4
  http: ^1.6.0
  # 拍照 / 选择作答图片（Android 相机 + 各平台相册/文件选择）
  image_picker: ^1.2.4
  # 定位 App 私有目录：config.json 和题库工作副本都放在这里
  path_provider: ^2.1.6
  webview_flutter: ^4.14.1
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 生成启动图标，命令：dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4
  # 测试里把 App 私有目录固定到临时文件夹
  path_provider_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  # 随包发布的资源。home_bg 的背景图已压缩成 WebP（约 2.8 MB），
  # 以后加图也建议先压缩成 WebP 再放进来
  assets:
    - assets/images/home_bg/ # 首页随机背景
    - assets/texts/ # 首页语录卡的文案（quotes.txt）
    - assets/plugins/ # 内置插件清单（standard/manifest.json）
    - assets/plugins/standard/ # 内置插件的 HTML/JS/CSS
    - assets/plugins/standard/katex/ # 离线公式渲染
    - assets/plugins/standard/katex/contrib/
    - assets/plugins/standard/katex/fonts/
    - assets/plugins/standard/fonts/ # 阿里巴巴普惠体

# 启动图标：由一张 1024x1024 的 PNG 生成各平台尺寸
flutter_launcher_icons:
  android: true
  # iOS 平台目录已移除；以后若重新执行 `flutter create --platforms=ios .`，
  # 再把这里改回 true 并补回 remove_alpha_ios
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
